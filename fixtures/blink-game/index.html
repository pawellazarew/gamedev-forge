<!doctype html>
<meta charset="utf-8">
<title>Blink Game (fixture)</title>
<!--
  Draws once every 60 frames. The low redrawn-frame ratio means the game
  is alive but rarely redraws. Also catches a sticky render flag: without
  resetting it, a single drawing operation marks every subsequent frame
  as redrawn, falsely raising the ratio to 100%.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  let t = 0;
  (function loop() {
    t++;
    if (t % 60 === 0) {
      ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
      ctx.fillStyle = '#f778ba'; ctx.fillRect((t / 60 * 60) % 560, 160, 80, 80);
    }
    requestAnimationFrame(loop);
  })();
</script>
