<!doctype html>
<meta charset="utf-8">
<title>HUD First (fixture)</title>
<!--
  A static score strip is declared before the game canvas, as happens with
  preloaders, backgrounds and HUD layers. document.querySelector('canvas')
  picked this strip, falsely declaring a healthy game unable to render.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="hud" width="200" height="30"></canvas>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const hud = document.getElementById('hud').getContext('2d');
  hud.fillStyle = '#161b22'; hud.fillRect(0, 0, 200, 30);
  hud.fillStyle = '#8b949e'; hud.font = '14px sans-serif'; hud.fillText('SCORE 0', 8, 20);

  const ctx = document.getElementById('game').getContext('2d');
  let t = 0;
  (function loop() {                          // game draws every frame
    t++;
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
    ctx.fillStyle = '#7ee787'; ctx.fillRect((t * 4) % 560, 160, 80, 80);
    requestAnimationFrame(loop);
  })();
</script>
