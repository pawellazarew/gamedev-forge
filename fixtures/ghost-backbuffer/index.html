<!doctype html>
<meta charset="utf-8">
<title>Ghost Backbuffer (fixture)</title>
<!--
  Missing blit: the game draws its entire scene to an offscreen buffer every
  frame but never copies it to the visible canvas. Drawing commands and game
  frames continue while the player sees a frozen screen.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const view = document.getElementById('game').getContext('2d');
  const back = document.createElement('canvas');   // outside DOM, invisible to the player
  back.width = 640; back.height = 400;
  const bctx = back.getContext('2d');

  view.fillStyle = '#0b0e14'; view.fillRect(0, 0, 640, 400);
  view.fillStyle = '#e6edf3'; view.font = '18px sans-serif';
  view.fillText('first frame; subsequent draws go nowhere', 20, 380);

  let t = 0;
  (function loop() {
    t++;
    bctx.fillStyle = '#0b0e14'; bctx.fillRect(0, 0, 640, 400);
    bctx.fillStyle = '#7ee787'; bctx.fillRect((t * 3) % 600, 150, 40, 40);
    // view.drawImage(back, 0, 0);  ← this is the missing line
    requestAnimationFrame(loop);
  })();
</script>
