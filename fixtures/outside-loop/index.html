<!doctype html>
<meta charset="utf-8">
<title>Outside Loop (фикстура)</title>
<!--
  Цикл rAF пустой, а рисует setInterval. Пиксели меняются, команды идут —
  но не из кадра игры. Признак отрисовки обязан быть привязан к колбэку,
  иначе рисующий таймер ручается за мёртвый игровой цикл.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  let t = 0;
  (function loop() { requestAnimationFrame(loop); })();   // кадры идут, рисования нет
  setInterval(() => {
    t++;
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
    ctx.fillStyle = '#d29922'; ctx.fillRect((t * 20) % 560, 160, 80, 80);
  }, 16);
</script>
