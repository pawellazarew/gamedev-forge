<!doctype html>
<meta charset="utf-8">
<title>Zombie Game (fixture)</title>
<!--
  Zombie game: render loop runs but nothing is drawn. requestAnimationFrame
  is called every frame and does nothing: game frame count is full, image frozen.
  This is how an empty loop differs from actual rendering, and game frame
  counts alone cannot distinguish them.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; }
  canvas { display: block; margin: 0 auto; }
  #hud { position: fixed; right: 8px; top: 8px; }
</style>
<canvas id="game" width="640" height="400"></canvas>
<!-- Adjacent HUD canvas that legitimately draws every frame.
          It cannot vouch for the game canvas: count rendering on the same
          surface whose pixels will later be compared. -->
<canvas id="hud" width="120" height="24"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  const hud = document.getElementById('hud').getContext('2d');
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, 640, 400);
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `hsl(${i * 9}, 70%, 55%)`;
    ctx.fillRect(20 + (i % 10) * 60, 40 + Math.floor(i / 10) * 80, 48, 48);
  }
  ctx.fillStyle = '#e6edf3';
  ctx.font = '20px sans-serif';
  ctx.fillText('loop runs but no frames are drawn', 20, 380);

  // Loop runs without work: no drawing command reaches the game canvas
  // after the first frame, while the HUD keeps ticking every frame.
  let ticks = 0;
  (function loop() {
    ticks++;
    hud.fillStyle = '#0b0e14'; hud.fillRect(0, 0, 120, 24);
    hud.fillStyle = '#8b949e'; hud.font = '12px sans-serif';
    hud.fillText('frame ' + ticks, 4, 16);
    requestAnimationFrame(loop);
  })();
</script>
