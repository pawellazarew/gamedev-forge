<!doctype html>
<meta charset="utf-8">
<title>Dirty Render (фикстура)</title>
<!--
  Здоровая игра, которая рисует ТОЛЬКО по событию: пошаговая, Wordle-подобная.
  Цикл жив, за окно замера без ввода не рисуется ни один кадр — и это норма,
  а не поломка. Форма, на которой гейт «рендер мёртв» даёт ложный красный.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  let letters = ['С', 'Л', 'О', 'В', 'О'], dirty = true;

  function render() {
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
    letters.forEach((ch, i) => {
      ctx.fillStyle = '#238636'; ctx.fillRect(60 + i * 100, 150, 80, 80);
      ctx.fillStyle = '#fff'; ctx.font = '40px sans-serif'; ctx.fillText(ch, 85 + i * 100, 205);
    });
  }
  (function loop() { if (dirty) { render(); dirty = false; } requestAnimationFrame(loop); })();
  addEventListener('keydown', () => { letters.push('?'); dirty = true; });
  addEventListener('pointerdown', () => { dirty = true; });
</script>
