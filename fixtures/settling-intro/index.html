<!doctype html>
<meta charset="utf-8">
<title>Settling Intro (fixture)</title>
<!--
  Title screen fades in for 1.5 seconds, then settles and waits for input.
  The loop stays alive but rendering legitimately stops, as on a pause,
  win or menu screen. The window-tail gate mistook this for dead rendering.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  const t0 = performance.now();
  let dirty = true;
  (function loop() {
    const k = Math.min(1, (performance.now() - t0) / 1400);
    if (dirty) {
      ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
      ctx.globalAlpha = k;
      ctx.fillStyle = '#58a6ff'; ctx.fillRect(220, 150, 200, 100);
      ctx.fillStyle = '#e6edf3'; ctx.font = '24px sans-serif'; ctx.fillText('START', 265, 210);
      ctx.globalAlpha = 1;
      if (k >= 1) dirty = false;              // animation finished; stop drawing
    }
    requestAnimationFrame(loop);
  })();
  addEventListener('pointerdown', () => { dirty = true; });
</script>
