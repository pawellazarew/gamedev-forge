<!doctype html>
<meta charset="utf-8">
<title>Dying Render (fixture)</title>
<!--
  Rendering works for the first few frames, then dies while the loop idles.
  Its redrawn-frame ratio resembles a game that draws rarely; only the
  tail of the measurement window distinguishes them.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  let t = 0;

  // Stop 1.8 seconds AFTER the measurement window opens, not after page load.
  // Otherwise the redrawn-frame ratio depends on page loading speed,
  // making this fixture intermittently test a different branch.
  // A 3-second window yields 60% drawing frames and a 40% idle tail,
  // independent of cadence because both values are counted in frames.
  let deadline = Infinity;
  const reset = window.__forgeResetFrames;
  window.__forgeResetFrames = () => { if (reset) reset(); deadline = performance.now() + 1800; };

  (function loop() {
    t++;
    if (performance.now() < deadline) {
      ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
      ctx.fillStyle = '#f0883e'; ctx.fillRect((t * 4) % 560, 160, 80, 80);
    }
    requestAnimationFrame(loop);
  })();
</script>
