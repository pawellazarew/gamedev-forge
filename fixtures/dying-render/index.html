<!doctype html>
<meta charset="utf-8">
<title>Dying Render (фикстура)</title>
<!--
  Рендер живёт первые кадры и умирает: дальше цикл крутится вхолостую.
  Доля перерисованных кадров такая же, как у игры, которая рисует редко, —
  различает их только хвост окна замера.
-->
<style>html,body{margin:0;height:100%;background:#0b0e14}canvas{display:block;margin:0 auto}</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  let t = 0;

  // Умираем через 1.8 секунды ПОСЛЕ открытия окна замера, а не после загрузки.
  // Иначе доля перерисованных кадров зависела бы от того, как быстро
  // загрузилась страница, и фикстура то и дело проверяла бы соседнюю ветку.
  // При окне в 3 секунды это даёт 60% кадров с отрисовкой и 40% хвоста —
  // одинаково на любом каденсе, потому что обе величины считаются в кадрах.
  let deadline = Infinity;
  const reset = window.__forgeResetFrames;
  window.__forgeResetFrames = () => { if (reset) reset(); deadline = performance.now() + 1800; };

  (function loop() {
    t++;
    if (performance.now() < deadline) {
      ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, 640, 400);
      ctx.fillStyle = '#f0883e'; ctx.fillRect((t * 4) % 560, 160, 80, 80);
    }
    requestAnimationFrame(loop);
  })();
</script>
