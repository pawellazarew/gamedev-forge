<!doctype html>
<meta charset="utf-8">
<title>Dead Game (fixture)</title>
<!--
  A game that draws one frame and dies: its render loop never starts.
  It looks alive in a screenshot (image and colors exist), but has zero game
  frames. Meanwhile the probe runs its OWN requestAnimationFrame and counts
  dozens of frames; this exposed a false pass in the sample check.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; }
  canvas { display: block; margin: 0 auto; }
</style>
<canvas id="game" width="640" height="400"></canvas>
<script>
  const ctx = document.getElementById('game').getContext('2d');
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, 640, 400);
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `hsl(${i * 9}, 70%, 55%)`;
    ctx.fillRect(20 + (i % 10) * 60, 40 + Math.floor(i / 10) * 80, 48, 48);
  }
  ctx.fillStyle = '#e6edf3';
  ctx.font = '20px sans-serif';
  ctx.fillText('one frame drawn', 20, 380);
  // No requestAnimationFrame: the render loop never starts.
</script>
