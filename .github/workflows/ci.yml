name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: game-forge
        run: npm ci

      - name: Download Chromium
        working-directory: game-forge
        run: npx playwright-core install --with-deps chromium

      - name: Check module syntax
        run: for f in game-forge/src/*.mjs game-forge/bin/*.mjs fixtures/*/forge.config.mjs fixtures/*/forge/*.mjs; do node --check "$f"; done

      - name: Check shell and Python syntax
        run: |
          bash -n blender-kit/*.sh install.sh
          python3 -m py_compile blender-kit/*.py

      - name: Unit tests
        working-directory: game-forge
        run: npm run test:unit

      - name: doctor
        run: node game-forge/bin/forge.mjs doctor

      # The fixture is a reference game with a minimal adapter: a healthy pipeline
      # passes scenarios and probe, and its veteran outperforms its casual bot.
      - name: play (scenarios and assertions)
        run: node game-forge/bin/forge.mjs play fixtures/tiny-game

      - name: probe (metrics and console errors)
        run: node game-forge/bin/forge.mjs probe fixtures/tiny-game --seconds 4 --strict

      # A passing probe on a healthy game proves nothing until it also rejects
      # broken games. dead-game has no rAF loop; zombie-game runs an empty loop
      # (game frames exist but nothing is drawn); ghost-backbuffer draws each
      # frame into an invisible backbuffer.
      #
      # Require exactly exit code 2 (failed verdict) and the failed check name:
      # accepting any nonzero exit would mistake a typo in the fixture path or
      # a missing browser for a working gate.
      - name: probe must reject dead rendering
        run: |
          check_red() {
            set +e
            node game-forge/bin/forge.mjs probe "fixtures/$1" --seconds 3 --strict
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "::error::probe on $1 exited with $code instead of 2 — gate failed or did not run"
              exit 1
            fi
            # Check the diagnostic too: otherwise a fixture could fail for the wrong
            # reason without anyone noticing.
            node -e '
              const fs = require("fs");
              const [game, want, phrase] = process.argv.slice(1);
              const p = JSON.parse(fs.readFileSync(`fixtures/${game}/.forge/latest-probe/probe.json`, "utf8"));
              const c = p.checks.find((c) => c.name === want);
              if (p.verdict !== "fail" || c?.status !== "fail") {
                console.error(`::error::${game}: expected failed check "${want}", got verdict=${p.verdict} ${want}=${c?.status}`);
                process.exit(1);
              }
              if (phrase && !c.detail.includes(phrase)) {
                console.error(`::error::${game}: check "${want}" failed for the wrong reason — expected «${phrase}», got «${c.detail}»`);
                process.exit(1);
              }
            ' "$1" "$2" "$3"
          }
          check_red dead-game        sample 'did not draw a single frame'
          check_red zombie-game      render 'rendering is dead'
          check_red ghost-backbuffer render 'rendering is dead'
          check_red dying-render     render 'rendering stopped'

      # The other side: healthy games with unusual render patterns must pass.
      # A false failure blocks work as reliably as a false pass lets defects
      # through. We encountered this twice while developing this gate.
      #   late-canvas    — canvas appears after the splash screen
      #   dirty-render   — draws only on input and has no rAF loop
      #   settling-intro — animation finishes and waits for input (title/pause/win)
      #   hud-first      — HUD is declared before the game canvas
      - name: probe must accept healthy games
        run: |
          for game in late-canvas dirty-render settling-intro hud-first; do
            node game-forge/bin/forge.mjs probe "fixtures/$game" --seconds 3 --strict
          done

      # DOM clicks pass through overlays, so their scenarios passed even when
      # the game was unplayable. The fixture checks both sides: an unobstructed
      # button must work with mouse and touch, while a covered button must fail
      # and identify the covering layer.
      - name: play must detect covered buttons
        run: |
          set +e
          node game-forge/bin/forge.mjs play fixtures/covered-button
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::play on covered-button exited with $code instead of 2"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("fixtures/covered-button/.forge/latest-play/play.json", "utf8"));
            const st = Object.fromEntries(p.scenarios.map((s) => [s.scenario, s]));
            for (const n of ["click-ok", "tap-ok", "opted-out"]) {
              if (st[n]?.status !== "pass") { console.error(`::error::${n} must pass, got ${st[n]?.status}`); process.exit(1); }
            }
            for (const n of ["second-click-covered", "dom-click-hides-it", "hittable@desktop", "hittable@phoneLandscape", "hittable@phone"]) {
              const bad = st[n]?.checks.find((c) => c.status === "fail");
              if (!bad || !bad.detail.includes("div#art")) {
                console.error(`::error::${n} must fail and name the covering layer, got ${JSON.stringify(bad)}`);
                process.exit(1);
              }
            }
          '

      - name: sim + analyze (deterministic simulation)
        run: node game-forge/bin/forge.mjs sim fixtures/tiny-game --runs 8 --max-ticks 20000

      - name: End-to-end pipeline tests
        working-directory: game-forge
        run: node --test --test-timeout 300000 test/e2e-*.test.mjs

      - name: Skill must affect the outcome
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("fixtures/tiny-game/.forge/latest-sim/analysis.json", "utf8"));
            const get = (n) => a.bots.find((b) => b.bot === n)?.winrate ?? 0;
            const gap = get("veteran") - get("casual");
            console.log("casual", get("casual"), "veteran", get("veteran"), "gap", gap.toFixed(2));
            if (gap < 0) { console.error("veteran performs worse than casual — pipeline or bot is broken"); process.exit(1); }
          '

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: forge-artifacts
          path: fixtures/tiny-game/.forge/
          # The directory starts with a dot. upload-artifact skips hidden files
          # by default, silently losing the artifacts without this flag.
          include-hidden-files: true
          retention-days: 7
