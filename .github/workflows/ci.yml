name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Установить зависимости
        working-directory: game-forge
        run: npm ci || npm install

      - name: Скачать Chromium
        working-directory: game-forge
        run: npx playwright install --with-deps chromium

      - name: Синтаксис всех модулей
        run: for f in game-forge/src/*.mjs game-forge/bin/*.mjs fixtures/*/forge.config.mjs fixtures/*/forge/*.mjs; do node --check "$f"; done

      - name: Синтаксис shell и python
        run: |
          bash -n blender-kit/*.sh install.sh
          python3 -m py_compile blender-kit/*.py

      - name: Юнит-тесты
        working-directory: game-forge
        run: npm run test:unit

      - name: doctor
        run: node game-forge/bin/forge.mjs doctor

      # Фикстура — эталонная игра с минимальным адаптером: если конвейер цел,
      # сценарий проходит, probe чистый, а ветеран обыгрывает казуала.
      - name: play (сценарии + ассерты)
        run: node game-forge/bin/forge.mjs play fixtures/tiny-game

      - name: probe (метрики и ошибки консоли)
        run: node game-forge/bin/forge.mjs probe fixtures/tiny-game --seconds 4 --strict

      # Зелёный probe на здоровой игре ничего не доказывает, пока не показано,
      # что сломанную он валит. dead-game не крутит rAF вовсе; zombie-game
      # крутит пустой (кадры игры полны, отрисовки нет); ghost-backbuffer
      # рисует каждый кадр в невидимый буфер.
      #
      # Требуем именно код 2 (красный вердикт) и имя провалившейся проверки:
      # «любой ненулевой код» означал бы, что опечатка в пути к фикстуре или
      # ненайденный браузер читаются как «гейт сработал».
      - name: probe обязан валить мёртвый рендер
        run: |
          check_red() {
            set +e
            node game-forge/bin/forge.mjs probe "fixtures/$1" --seconds 3 --strict
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "::error::probe на $1 вышел с кодом $code вместо 2 — гейт не сработал или вовсе не запустился"
              exit 1
            fi
            # Сверяем и текст: без него фикстура могла бы краснеть по другой
            # причине, чем задумано, и никто бы этого не заметил.
            node -e '
              const fs = require("fs");
              const [game, want, phrase] = process.argv.slice(1);
              const p = JSON.parse(fs.readFileSync(`fixtures/${game}/.forge/latest-probe/probe.json`, "utf8"));
              const c = p.checks.find((c) => c.name === want);
              if (p.verdict !== "fail" || c?.status !== "fail") {
                console.error(`::error::${game}: ожидали красную проверку "${want}", получили verdict=${p.verdict} ${want}=${c?.status}`);
                process.exit(1);
              }
              if (phrase && !c.detail.includes(phrase)) {
                console.error(`::error::${game}: проверка "${want}" красная не по той причине — ждали «${phrase}», получили «${c.detail}»`);
                process.exit(1);
              }
            ' "$1" "$2" "$3"
          }
          check_red dead-game        sample 'не нарисовала ни одного кадра'
          check_red zombie-game      render 'рендер мёртв'
          check_red ghost-backbuffer render 'рендер мёртв'
          check_red dying-render     render 'отрисовка встала'

      # Обратная сторона: здоровая игра необычной формы обязана проходить.
      # Ложный красный блокирует работу так же надёжно, как ложный зелёный её
      # пропускает, и за время работы над этим гейтом ловился дважды.
      #   late-canvas    — канвас появляется после заставки
      #   dirty-render   — рисует только по вводу, rAF не заводит вовсе
      #   settling-intro — доиграл анимацию и ждёт ввода (титул, пауза, победа)
      #   hud-first      — индикатор объявлен раньше игрового канваса
      - name: probe не должен валить здоровые игры
        run: |
          for game in late-canvas dirty-render settling-intro hud-first; do
            node game-forge/bin/forge.mjs probe "fixtures/$game" --seconds 3 --strict
          done

      # DOM-клик проходит сквозь перекрывающий слой, поэтому сценарий на нём
      # зеленел на неиграбельной игре. Фикстура держит обе половины: свободная
      # кнопка обязана проходить мышью и касанием, перекрытая — краснеть с
      # именем перекрывающего слоя.
      - name: play обязан ловить перекрытую кнопку
        run: |
          set +e
          node game-forge/bin/forge.mjs play fixtures/covered-button
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::play на covered-button вышел с кодом $code вместо 2"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("fixtures/covered-button/.forge/latest-play/play.json", "utf8"));
            const st = Object.fromEntries(p.scenarios.map((s) => [s.scenario, s]));
            for (const n of ["click-ok", "tap-ok", "opted-out"]) {
              if (st[n]?.status !== "pass") { console.error(`::error::${n} обязан проходить, получили ${st[n]?.status}`); process.exit(1); }
            }
            for (const n of ["second-click-covered", "dom-click-hides-it", "hittable@desktop", "hittable@phoneLandscape", "hittable@phone"]) {
              const bad = st[n]?.checks.find((c) => c.status === "fail");
              if (!bad || !bad.detail.includes("div#art")) {
                console.error(`::error::${n} обязан краснеть с именем перекрывающего слоя, получили ${JSON.stringify(bad)}`);
                process.exit(1);
              }
            }
          '

      - name: sim + analyze (детерминированная симуляция)
        run: node game-forge/bin/forge.mjs sim fixtures/tiny-game --runs 8 --max-ticks 20000

      - name: Сквозные тесты конвейера
        working-directory: game-forge
        run: node --test --test-timeout 300000 test/e2e-*.test.mjs

      - name: Навык должен влиять на исход
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("fixtures/tiny-game/.forge/latest-sim/analysis.json", "utf8"));
            const get = (n) => a.bots.find((b) => b.bot === n)?.winrate ?? 0;
            const gap = get("veteran") - get("casual");
            console.log("casual", get("casual"), "veteran", get("veteran"), "разрыв", gap.toFixed(2));
            if (gap < 0) { console.error("ветеран играет хуже казуала — конвейер или бот сломан"); process.exit(1); }
          '

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: forge-artifacts
          path: fixtures/tiny-game/.forge/
          # Каталог начинается с точки, а upload-artifact по умолчанию скрытые
          # файлы пропускает — без этого флага артефакты молча теряются
          include-hidden-files: true
          retention-days: 7
